name: ci

# 复建的流水线（缺陷台账 D-08）：只做本仓当前真实存在的能力，不虚构覆盖率。
# 分层：static（无依赖静态检查） / tests（Windows + 锁文件装依赖） / js（Node 控制器）

on:
  push:
    # feat-brush-duration 是本 fork 的工作分支：推它也要跑流水线
    branches: [main, feat-brush-duration]
    tags: ["v*"]
  pull_request:
  # 手动触发：fork 场景下不必推空提交也能验证流水线
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"

jobs:
  static:
    name: 静态检查
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 语法编译
        run: >
          python -m compileall -q
          UnipusAI_Helper.py time_brushing.py
          unipus_helper tests

      - name: 凭据扫描
        shell: bash
        run: |
          set -euo pipefail
          # 用 git grep 而非 xargs：Git Bash 下 xargs 有 arg_max 断言崩溃风险
          # docs/ 与 CHANGELOG 含扫描规则的字面说明，排除以免误报
          rc=0
          out=$(git grep -nEI 'eyJ[A-Za-z0-9_-]{10,}|sk-[A-Za-z0-9]{20,}' -- . ':(exclude)docs/*' ':(exclude)CHANGELOG.md') || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "$out"
            echo "::error::检测到疑似凭据，禁止入库"
            exit 1
          fi
          if [ "$rc" -ne 1 ]; then
            echo "::error::凭据扫描执行异常 rc=$rc"
            exit 1
          fi
          echo "凭据扫描通过（无命中）"

      - name: 锁文件与清单一致
        shell: bash
        run: |
          set -euo pipefail
          test -f requirements.lock || { echo "::error::缺少 requirements.lock"; exit 1; }
          python - <<'PY'
          import re, pathlib, sys
          req = pathlib.Path("requirements.txt").read_text(encoding="utf-8")
          lock = pathlib.Path("requirements.lock").read_text(encoding="utf-8")
          names = {m.group(1).lower() for m in re.finditer(r"^\s*([A-Za-z0-9_.\-]+)", req, re.M)
                   if m.group(1) and not m.group(1).startswith("#")}
          missing = [n for n in names if not re.search(rf"^{re.escape(n)}==", lock, re.M | re.I)]
          print("requirements:", len(names), "missing in lock:", missing)
          sys.exit(1 if missing else 0)
          PY

      - name: 版本号与 tag 一致
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          ver=$(python -c "import re,io;src=io.open('UnipusAI_Helper.py',encoding='utf-8').read();print(re.search(r'APP_VERSION\s*=\s*\"([^\"]+)\"',src).group(1))")
          tag=${GITHUB_REF_NAME#v}
          echo "APP_VERSION=$ver tag=$tag"
          [ "$ver" = "$tag" ] || { echo "::error::版本号与 tag 不一致"; exit 1; }

  tests:
    name: 离线测试（刷时长）
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 按锁文件安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: 宿主逻辑测试
        run: python tests/test_time_brushing.py

      - name: 静默异常留痕测试
        run: python tests/test_swallow.py

      - name: 页面解析基线（需要 Edge，缺失自动跳过）
        run: python tests/test_page_parse_baseline.py

      - name: 上传失败日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: logs/
          if-no-files-found: ignore
          retention-days: 7

  js:
    name: 页面内控制器（node）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tests/test_time_brushing_controller.js
